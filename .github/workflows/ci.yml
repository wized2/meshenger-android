name: CI
on:
  push:
    branches: [feature/material3]
  pull_request:
    branches: [feature/material3]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Assemble release
        run: ./gradlew assembleFdroidRelease --stacktrace
      - name: Verify APK signature
        run: |
          SDK=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          "$SDK/apksigner" verify --verbose "$APK"
          "$SDK/zipalign" -c -v 4 "$APK"
          ls -la "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: app-fdroid-release
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
