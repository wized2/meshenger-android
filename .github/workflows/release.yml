name: Release

on:
  push:
    branches: [feature/material-you-3-expressive]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build signed release APK
        run: ./gradlew assembleFdroidRelease --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*fdroid-release*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found $APK"
          ls -la "$APK"

      - name: Pack source
        run: |
          git archive --format=tar.gz --prefix=meshenger-android-source/ -o meshenger-android-source.tar.gz HEAD
          zip -r meshenger-android-source.zip . \
            -x '.git/*' -x 'app/build/*' -x '.gradle/*' -x '**/.gradle/*' -x '**/build/*'

      - name: Version
        id: ver
        run: |
          NAME=$(grep versionName app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          CODE=$(grep versionCode app/build.gradle | head -1 | sed 's/[^0-9]//g')
          TAG="v${NAME}-m3-expressive"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Meshenger ${{ steps.ver.outputs.name }} (Material You 3)
          body: |
            ## Meshenger ${{ steps.ver.outputs.name }} — Material You 3 expressive

            Fork build with Material You 3 theme, R8 minify, and resource shrink.

            ### Assets
            - **APK** — fdroid release, signed
            - **Source** — `.tar.gz` and `.zip`

            ### Notes
            - Application id: `d.d.meshenger` (fdroid flavor)
            - Signed with the fork release keystore in this repository
          files: |
            ${{ steps.apk.outputs.path }}
            meshenger-android-source.tar.gz
            meshenger-android-source.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
