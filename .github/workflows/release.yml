name: Release
on:
  push:
    branches: [feature/material3]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - run: ./gradlew assembleFdroidRelease --stacktrace
      - name: Verify
        run: |
          SDK=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          "$SDK/apksigner" verify --verbose "$APK"
          ls -la "$APK"
      - name: Pack
        run: |
          git archive --format=tar.gz --prefix=meshenger-android-source/ -o meshenger-android-source.tar.gz HEAD
          zip -qr meshenger-android-source.zip . -x '.git/*' -x 'app/build/*' -x '.gradle/*' -x '**/build/*'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.5.2-m3
          name: Meshenger 4.5.2 M3 polish
          body: |
            Thanks for the 100 gold coins.

            - **M3 overflow / 3-dot menu** (rounded popup, theme surface)
            - **Settings** denser M3 rows, larger cards, clearer labels
            - **Night seed colors** for FireRed / GrassGreen / SkyBlue / NightGrey
            - **Bottom nav** uses Material3 theme tints (better contrast + day/night)
            - Still no minify; v1+v2+v3 signed

            Uninstall previous build, then install this APK.
          files: |
            app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
            meshenger-android-source.tar.gz
            meshenger-android-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
