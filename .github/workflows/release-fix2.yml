name: ReleaseFix2

on:
  push:
    branches: [feature/material-you-3-expressive]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - run: ./gradlew assembleFdroidRelease --stacktrace
      - name: Pack source
        run: |
          git archive --format=tar.gz --prefix=meshenger-android-source/ -o meshenger-android-source.tar.gz HEAD
          zip -qr meshenger-android-source.zip . -x '.git/*' -x 'app/build/*' -x '.gradle/*' -x '**/build/*'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.4.9-m3-expressive-fix2
          name: Meshenger 4.4.9 M3 (crash fix 2)
          body: |
            Launch crash fix (minify still ON):
            - Fixed MySpinner (was invalid TextInputLayout style on dropDownListViewStyle)
            - Theme attrs declared at top level
            - Full M3 color roles + secondaryContainer
            - R8: -dontoptimize, full keeps, shrinkResources OFF
            - Signed release APK + source
          files: |
            app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
            meshenger-android-source.tar.gz
            meshenger-android-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
